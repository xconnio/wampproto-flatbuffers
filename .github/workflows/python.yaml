name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - python/**

  pull_request:
    branches:
      - main
    paths:
      - python/**

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install flatc
        run: make install-flatc

      - name: Setup environment & install dependencies
        run: make setup

      - name: Run tests
        run: make test

  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Ruff
        uses: chartboost/ruff-action@v1
        with:
          src: './python'
